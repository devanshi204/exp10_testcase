<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Electricity Insights</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #26332d;
        }

        .container {
            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #285943;
            font-size: 28px;
        }

        p {
            text-align: center;
            color: #65736c;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd5d0;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 11px;
            background: #285943;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .login {
            margin-top: 20px;
            text-align: center;
        }

        .login a {
            color: #285943;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Create Account</h1>

        <p>Start tracking your electricity usage</p>

        <form action="/signup" method="post">

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Sign Up</button>

        </form>

        <div class="login">
            Already have an account?
            <a href="login.html">Sign In</a>
        </div>

    </div>

</body>
</html>
