
trigger:
  - main

pool:
  vmImage: ubuntu-latest

services:
  mysql:
    image: mysql:8.0
    env:
      MYSQL_ROOT_PASSWORD: 'licet@123'
      MYSQL_DATABASE: electricity
    ports:
      - 3306:3306
    options: >-
      --health-cmd="mysqladmin ping -h localhost -plicet@123"
      --health-interval=10s
      --health-timeout=5s
      --health-retries=10

steps:
  - task: Maven@4
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean test'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.21'
      jdkArchitectureOption: 'x64'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/electricity
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 'licet@123'
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
